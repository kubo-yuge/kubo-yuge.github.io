<script id="csinit" type="text/x-cindyscript">
//KETlib
use("KetCindyPlugin");
Dircdy=loaddirectory;
setdirectory(gethome());
import("ketcindy.ini");

;

</script>
<script id="cskeytyped" type="text/x-cindyscript">
//Script (CindyScript)
kL=keydownlist();
if(length(kL)>0,
  if(kL==[17,70], //Ctr+f (Figures)
    Viewtex();
    kc();
  );
  if(kL==[16,17,80], //Ctr+Shift+p (Parent)
    if(length(Shellparent)>0,
      Makeshell(),Makebat();
    );
    WritetoSci(2);
    kc();
  );
  if(kL==[17,74], //Ctr+j (Ketjsoff)
    Mkketcindyjs(append(KETJSOP,"Web=n"));
  );
  if(kL==[16,17,74], //Ctr+Shift+j (Ketjson)
    Mkketcindyjs(append(KETJSOP,"Web=yj"));
  );
);
;

</script>
<script id="csdraw" type="text/x-cindyscript">
//figures
Ketinit();
//Setparent(Cdyname()+"p");
//Setunitlen("1cm");
//Fontsize("n");
Addax(0);
Listplot("5",[[3,-3],[3,4]],["dr,2"]);
Listplot("6",[[3,0],[24,0]],["dr,2"]);
Listplot("7",[[3+3*pi/2,.4],[3+3*pi/2,-.4]]);
Setmarklen(2);
Htickmark([3,"s.9e.9",0,3+3*pi/2,"s2","\frac{\pi}{2}"]);
Htickmark([3+3*pi,"s2","\pi",3+6*pi,"s2","2\pi"]);
Setwindow([-4,24],[-5,4]);
Putpoint("O",[0,0]);
Circledata("11",[O,[3,0]]);

Slider("A",[-pi/2,-4.5],[6.3,-4.5]);
Slider("C",[0,-3.5],[2*pi,-3.5]);
Defvar(["the",C.x]);Defvar(["tha",A.x]);
Putpoint("P",3*[cos(tha),sin(tha)]);
Putpoint("R",3*[cos(the),sin(the)]);
if(tha>0,
Putpoint("Q",P+3*(the-tha)*[-sin(tha),cos(tha)]);
);
if(tha<=0,
Putpoint("Q",X+3*the*[-sin(tha),cos(tha)]);
);
if(tha>the,
Q.visible = false,Q.visible = true
);
Putpoint("X",[3,0]);
Listplot("1",[X,O,R]);
Polarplot("1","3","t=[0,the]",["dr,4","Color=red"]);
if((tha>0)&(tha<=the),
Polarplot("2","3","t=[tha,the]",["dr,4","Color=red"]);
Polarplot("3","3","t=[0,tha]",["dr,4","Color=cyan"]);
Listplot("2",[P,Q],["dr,4","Color=cyan"]);
);
if(tha<=0,
Polarplot("3","3","t=[0,the]",["dr,4","Color=red"]);
Listplot("2",[X,Q],["dr,4","Color=cyan"]);
);
Letter([[2,6],"e","水色の線と赤色の線は，同じ長さ"],["Size=2"]);
//Figpdf();
//BBdata();
Windispg();

;

</script>
